name: build

# Every push to main is tested and packaged. The version in package.json is
# what decides whether that build also becomes a release: if no release exists
# for it yet, one is cut. So bumping the number in package.json is the whole
# ritual -- no tagging by hand, and ordinary commits do not spam the releases
# page with 160 MB of duplicates.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to create the tag and release; nothing else

jobs:
  build:
    # Windows, because the packaged icon is a .ico -- setting one from Linux
    # needs wine. The app is Windows-only anyway.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # package.json engines requires >=22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Package
        run: npm run build

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Rep4Rep-win32-x64/* -DestinationPath Rep4Rep-win32-x64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Rep4Rep-win32-x64
          path: Rep4Rep-win32-x64.zip
          retention-days: 14

      # Only on main, and only when package.json names a version that has not
      # been released yet. A tag pushed by GITHUB_TOKEN does not start another
      # workflow run, so this cannot loop.
      - name: Release new versions
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "$tag is already released - bump the version in package.json to cut a new one."
            exit 0
          }

          Write-Output "Releasing $tag"
          git tag $tag
          git push origin $tag
          gh release create $tag Rep4Rep-win32-x64.zip --title $tag --generate-notes

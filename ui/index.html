<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: data:;">
<title>Rep4Rep</title>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #141b24;
    --surface-2: #1a232e;
    --edge:      #232e3b;
    --edge-soft: #1b242f;

    --ink:       #dbe4ee;
    --ink-dim:   #8b98a5;
    --ink-faint: #5a6672;

    --accent:    #4da3ff;
    --accent-dim:#2a5f99;
    --ok:        #57c77b;
    --warn:      #e3b341;
    --bad:       #f0806c;

    --radius: 10px;
    --tab: tabular-nums;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ---------- title bar ---------- */

  #bar {
    height: 44px; flex: none;
    display: flex; align-items: center; gap: 10px;
    /* right padding clears the native window controls drawn by titleBarOverlay */
    padding: 0 148px 0 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--edge-soft);
    -webkit-app-region: drag;
  }
  #bar .mark {
    width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    flex: none;
  }
  #bar h1 { font-size: 13px; font-weight: 650; letter-spacing: .01em; }
  #bar .spacer { flex: 1; }
  #bar .acct { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
  #bar .acct .name { color: var(--ink-dim); }
  #bar .pts {
    font-weight: 650; color: var(--ok);
    font-variant-numeric: var(--tab);
    background: rgba(87,199,123,.1);
    border: 1px solid rgba(87,199,123,.22);
    padding: 3px 9px; border-radius: 999px; font-size: 12px;
  }

  /* ---------- layout ---------- */

  #shell { flex: 1; display: grid; grid-template-columns: 290px 1fr; min-height: 0; }

  aside {
    background: var(--surface);
    border-right: 1px solid var(--edge-soft);
    display: flex; flex-direction: column; min-height: 0;
  }
  main { display: flex; flex-direction: column; min-height: 0; }

  .head {
    flex: none; padding: 16px 16px 10px;
    font-size: 10.5px; font-weight: 650; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  /* ---------- profile cards ---------- */

  #profiles { flex: 1; overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }

  .card {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
  }
  .card.spent { border-color: rgba(240,128,108,.28); }
  .card img { width: 38px; height: 38px; border-radius: 8px; flex: none; background: var(--edge); }
  .card .meta { flex: 1; min-width: 0; }
  .card .nm {
    font-weight: 600; color: #fff; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .sub { font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: var(--tab); }

  .ring { position: relative; width: 38px; height: 38px; flex: none; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring circle { fill: none; stroke-width: 3.5; stroke-linecap: round; }
  .ring .track { stroke: var(--edge); }
  .ring .fill  { stroke: var(--ok); transition: stroke-dashoffset .45s ease, stroke .3s; }
  .card.spent .ring .fill { stroke: var(--bad); }
  .ring b {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 10.5px; font-weight: 650; color: var(--ink-dim);
    font-variant-numeric: var(--tab);
  }

  /* ---------- controls ---------- */

  #controls { flex: none; border-top: 1px solid var(--edge-soft); padding: 14px 16px 16px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-bottom: 12px; }
  .field label {
    display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 4px; font-weight: 600;
  }
  .field input {
    width: 100%; padding: 7px 9px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 7px;
    font: inherit; font-variant-numeric: var(--tab);
    user-select: text;
  }
  .field input:focus { outline: none; border-color: var(--accent-dim); background: #0a0e13; }

  .toggle {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 0; cursor: pointer; color: var(--ink-dim); font-size: 12.5px;
  }
  .toggle input { appearance: none; margin: 0; flex: none; width: 32px; height: 18px;
    background: var(--edge); border-radius: 999px; position: relative; cursor: pointer;
    transition: background .18s; }
  .toggle input::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%; background: var(--ink-faint);
    transition: transform .18s, background .18s;
  }
  .toggle input:checked { background: var(--accent-dim); }
  .toggle input:checked::after { transform: translateX(14px); background: var(--accent); }
  .toggle:hover { color: var(--ink); }

  button {
    width: 100%; padding: 10px; margin-top: 8px;
    border: 0; border-radius: 8px; cursor: pointer;
    font: inherit; font-weight: 650; font-size: 13px; color: #06121f;
    background: var(--accent);
    transition: filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button.ghost {
    background: transparent; color: var(--bad);
    border: 1px solid rgba(240,128,108,.32);
  }
  button.ghost:hover:not(:disabled) { background: rgba(240,128,108,.1); }
  button:disabled { opacity: .35; cursor: default; }

  select {
    width: 100%; padding: 7px 9px; margin-bottom: 12px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 7px; font: inherit;
  }

  /* ---------- run strip ---------- */

  #strip {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; border-bottom: 1px solid var(--edge-soft);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--edge); color: var(--ink-dim);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .pill.live { color: var(--ok); border-color: rgba(87,199,123,.3); background: rgba(87,199,123,.08); }
  .pill.live .dot { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  #tally { margin-left: auto; display: flex; gap: 18px; }
  #tally div { text-align: right; }
  #tally b {
    display: block; font-size: 19px; font-weight: 650; line-height: 1.1;
    font-variant-numeric: var(--tab); color: #fff;
  }
  #tally b.ok { color: var(--ok); }
  #tally b.bad { color: var(--bad); }
  #tally span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); }

  /* ---------- countdown ---------- */

  #hero {
    display: none; flex: none; margin: 16px 20px 0;
    padding: 18px; text-align: center;
    background: linear-gradient(180deg, rgba(227,179,65,.07), transparent);
    border: 1px solid rgba(227,179,65,.24); border-radius: var(--radius);
  }
  #hero.on { display: block; }
  #hero .t {
    font-size: 34px; font-weight: 300; letter-spacing: -.02em; color: var(--warn);
    font-variant-numeric: var(--tab); line-height: 1.1;
  }
  #hero .c { font-size: 12px; color: var(--ink-dim); margin-top: 5px; }

  /* ---------- feed ---------- */

  #feed { flex: 1; overflow-y: auto; padding: 12px 20px 20px; min-height: 0; }
  #feed::-webkit-scrollbar, #profiles::-webkit-scrollbar { width: 9px; }
  #feed::-webkit-scrollbar-thumb, #profiles::-webkit-scrollbar-thumb {
    background: var(--edge); border-radius: 9px; border: 3px solid transparent; background-clip: content-box;
  }

  .ev { display: flex; gap: 11px; padding: 5px 0; align-items: baseline; }
  .ev time { flex: none; width: 56px; font-size: 11px; color: var(--ink-faint); font-variant-numeric: var(--tab); }
  .ev .ico { flex: none; width: 14px; text-align: center; font-size: 11px; color: var(--ink-faint); }
  .ev .msg { flex: 1; color: var(--ink-dim); user-select: text; }
  .ev.ok  .msg { color: var(--ink); }
  .ev.ok  .ico { color: var(--ok); }
  .ev.bad .msg { color: var(--bad); }
  .ev.bad .ico { color: var(--bad); }

  .batch {
    margin: 8px 0 8px 67px; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--edge-soft);
    border-left: 2px solid var(--accent-dim); border-radius: 8px;
  }
  .batch .row { display: flex; gap: 10px; padding: 3px 0; align-items: baseline; }
  .batch .who { color: var(--ink); font-weight: 600; flex: none; }
  .batch .q { color: var(--accent); font-size: 12.5px; user-select: text; }

  #empty { display: grid; place-items: center; height: 100%; text-align: center; }
  #empty .big { font-size: 15px; color: var(--ink-dim); margin-bottom: 6px; }
  #empty .small { font-size: 12.5px; color: var(--ink-faint); max-width: 330px; line-height: 1.6; }
  #empty code {
    user-select: text; font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px;
    background: var(--surface-2); border: 1px solid var(--edge);
    padding: 2px 6px; border-radius: 5px; color: var(--accent);
  }
</style>
</head>
<body>

<div id="bar">
  <div class="mark"></div>
  <h1>Rep4Rep</h1>
  <div class="spacer"></div>
  <div class="acct">
    <span class="name" id="who">—</span>
    <span class="pts" id="pts" style="display:none"></span>
  </div>
</div>

<div id="shell">
  <aside>
    <div class="head">Profiles</div>
    <div id="profiles"></div>

    <div id="controls">
      <select id="account"></select>

      <div class="grid">
        <div class="field"><label for="count">Comments</label><input type="number" id="count" value="10" min="1" max="100"></div>
        <div class="field"><label for="batch">Per fetch</label><input type="number" id="batch" value="3" min="1" max="20"></div>
        <div class="field"><label for="min">Min pause</label><input type="number" id="min" value="20" min="0"></div>
        <div class="field"><label for="max">Max pause</label><input type="number" id="max" value="45" min="0"></div>
      </div>

      <label class="toggle"><input type="checkbox" id="wait"> Wait out cooldowns</label>
      <label class="toggle"><input type="checkbox" id="ignoreQuota"> Ignore local ledger</label>

      <button id="go">Start run</button>
      <button id="halt" class="ghost" disabled>Stop</button>
    </div>
  </aside>

  <main>
    <div id="strip">
      <span class="pill" id="pill"><i class="dot"></i><span id="pillText">Idle</span></span>
      <div id="tally">
        <div><b class="ok" id="tDone">0</b><span>done</span></div>
        <div><b class="bad" id="tFail">0</b><span>failed</span></div>
        <div><b id="tFetch">0</b><span>fetches</span></div>
      </div>
    </div>

    <div id="hero"><div class="t">—</div><div class="c"></div></div>

    <div id="feed">
      <div id="empty">
        <div>
          <div class="big">Nothing running</div>
          <div class="small" id="emptyHint">Pick an account and start a run.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');

function duration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
}

let running = false;
let until = null;
let tally = { done: 0, failed: 0, fetches: 0 };

/* ---------- chrome ---------- */

function setRunning(on) {
  running = on;
  $('go').disabled = on;
  $('halt').disabled = !on;
  $('go').textContent = on ? 'Running…' : 'Start run';
  $('pill').className = 'pill' + (on ? ' live' : '');
  $('pillText').textContent = on ? 'Running' : 'Idle';
}

function bump(k, v) { tally[k] = v; $(k === 'done' ? 'tDone' : k === 'failed' ? 'tFail' : 'tFetch').textContent = v; }

function clearFeed() {
  $('feed').innerHTML = '';
  tally = { done: 0, failed: 0, fetches: 0 };
  bump('done', 0); bump('failed', 0); bump('fetches', 0);
}

const ICONS = { ok: '●', bad: '✕', note: '·', plain: '·' };

function line(kind, msg) {
  const el = document.createElement('div');
  el.className = 'ev ' + (kind || '');
  el.innerHTML = '<time>' + new Date().toLocaleTimeString([], { hour12: false }) + '</time>'
    + '<span class="ico">' + (ICONS[kind] || '·') + '</span>'
    + '<span class="msg">' + msg + '</span>';
  $('feed').appendChild(el);
  $('feed').scrollTop = $('feed').scrollHeight;
}

setInterval(() => {
  const hero = $('hero');
  if (!until) { hero.classList.remove('on'); return; }
  const left = until - Date.now();
  if (left <= 0) { until = null; hero.classList.remove('on'); return; }
  hero.classList.add('on');
  hero.querySelector('.t').textContent = duration(left);
}, 250);

/* ---------- state ---------- */

function ring(used, limit) {
  // The ring shows what is LEFT, so it drains as the day is spent.
  const r = 17, circ = 2 * Math.PI * r;
  const left = Math.max(0, limit - used);
  const off = circ - Math.min(1, left / limit) * circ;
  return '<div class="ring"><svg width="38" height="38">'
    + '<circle class="track" cx="19" cy="19" r="' + r + '"></circle>'
    + '<circle class="fill" cx="19" cy="19" r="' + r + '" stroke-dasharray="' + circ + '" stroke-dashoffset="' + off + '"></circle>'
    + '</svg><b>' + (limit - used) + '</b></div>';
}

async function refresh() {
  const s = await window.api.state();

  $('who').textContent = s.user ? s.user.username : (s.error ? 'not connected' : '—');
  if (s.user) { $('pts').style.display = ''; $('pts').textContent = s.user.points + ' pts'; }

  const sel = $('account');
  if (!sel.options.length && s.accounts.length) {
    for (const a of s.accounts) sel.add(new Option(a.name, a.name));
  }

  $('profiles').innerHTML = s.profiles.map(p => {
    const u = p.usage;
    const spent = u.remaining === 0;
    const sub = spent && u.resetAt
      ? 'full · resets in ' + duration(u.resetAt - Date.now())
      : u.used + ' of ' + u.limit + ' used today';
    return '<div class="card' + (spent ? ' spent' : '') + '">'
      + '<img src="' + esc(p.avatar || '') + '" alt="">'
      + '<div class="meta"><div class="nm">' + esc(p.personaName) + '</div>'
      + '<div class="sub">' + sub + '</div></div>'
      + ring(u.used, u.limit) + '</div>';
  }).join('');

  const hint = $('emptyHint');
  if (!s.accounts.length) {
    hint.innerHTML = 'No saved Steam sign-in. Run <code>npm start -- login</code> in a terminal once, then reopen.';
    $('go').disabled = true;
  } else if (s.error) {
    hint.textContent = s.error;
    $('go').disabled = true;
  } else if (!running) {
    $('go').disabled = false;
  }

  setRunning(s.running);
}

/* ---------- events ---------- */

window.api.onEvent(ev => {
  if (ev.type === 'log') {
    line(ev.kind, esc(ev.text));
  } else if (ev.type === 'fetch') {
    bump('fetches', ev.n);
    line('note', 'Fetched ' + ev.offered + ' target' + (ev.offered === 1 ? '' : 's') + ', taking ' + ev.taken.length);
    const box = document.createElement('div');
    box.className = 'batch';
    box.innerHTML = ev.taken.map(t =>
      '<div class="row"><span class="who">' + esc(t.name) + '</span><span class="q">“' + esc(t.comment) + '”</span></div>'
    ).join('');
    $('feed').appendChild(box);
    $('feed').scrollTop = $('feed').scrollHeight;
  } else if (ev.type === 'countdown') {
    until = ev.until;
    if (ev.until) $('hero').querySelector('.c').textContent = ev.label || 'waiting';
  } else if (ev.type === 'blocked') {
    line('note', esc(ev.why) + ' until ' + new Date(ev.until).toLocaleString());
  } else if (ev.type === 'result') {
    bump('done', ev.done); bump('failed', ev.failed); bump('fetches', ev.fetches);
  } else if (ev.type === 'status') {
    setRunning(ev.running);
    if (!ev.running) { until = null; refresh(); }
  }

  // Keep the counters honest even before the final result arrives.
  if (ev.type === 'log' && ev.kind === 'ok' && /marked complete/.test(ev.text)) bump('done', tally.done + 1);
  if (ev.type === 'log' && ev.kind === 'bad') bump('failed', tally.failed + 1);
});

/* ---------- actions ---------- */

$('go').onclick = async () => {
  clearFeed();
  setRunning(true);
  const r = await window.api.run({
    account: $('account').value,
    count: +$('count').value, batch: +$('batch').value, limit: 10,
    min: +$('min').value, max: +$('max').value,
    wait: $('wait').checked, ignoreQuota: $('ignoreQuota').checked,
  });
  if (r && r.error) { line('bad', esc(r.error)); setRunning(false); }
};

$('halt').onclick = () => window.api.stop();

refresh();
setInterval(() => { if (!running) refresh(); }, 20000);
</script>
</body>
</html>
